# Netlify staging config — Haidrun (Astro)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Indexing switch — PUBLIC_INDEXABLE drives BOTH the noindex meta tag and /robots.txt.
  # Default TRUE so the live production site (haidrun.com) is indexable: robots Allow + Sitemap,
  # no noindex. robots.txt is generated by src/pages/robots.txt.ts; /thank-you stays noindex.
  PUBLIC_INDEXABLE = "true"

# Keep preview and branch deploys OUT of the index (they run on *.netlify.app URLs):
[context.deploy-preview.environment]
  PUBLIC_INDEXABLE = "false"

[context.branch-deploy.environment]
  PUBLIC_INDEXABLE = "false"

# ---------------------------------------------------------------------------
# Legacy haidrun.com (old WordPress / DPP site) -> new Astro site. Added 2026-08-08.
# The old site pushed a traceability / Digital Product Passport narrative; the DPP
# line is retired and haidrun.com is now the canonical domain for the digital-money
# platform. These 301s consolidate the old URLs' link equity onto the new pages and
# stop Google seeing two conflicting narratives on one domain.
#
# force = true is required for pages that STILL serve old 200 content at deploy time
# (verified 2026-08-08: /about/ and /press/* return old Swedish DPP / IoT content,
# served by a layer outside this repo — a migration-time fallback to old WordPress).
# netlify.toml redirects are the highest-precedence layer, so a forced rule wins even
# over that fallback for the listed paths.
#
# Order matters (first match wins): specific forced rules first, non-forced wildcard
# safety nets last so they ONLY fire on otherwise-404 legacy paths and never shadow
# real new pages such as /solutions/payments/ or /resources/.
# ---------------------------------------------------------------------------

# Old "About" page (still live, old Swedish DPP copy) -> new Company page.
[[redirects]]
  from = "/about/"
  to = "/company/"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/company/"
  status = 301
  force = true

# Old 2021 press / PR articles (enterprise blockchain, IoT, insurance, telecoms) -> Company.
[[redirects]]
  from = "/press/*"
  to = "/company/"
  status = 301
  force = true

# Old Swedish FAQ page -> home (no direct equivalent on the new site).
[[redirects]]
  from = "/fragor-och-svar/"
  to = "/"
  status = 301
  force = true

# Retired DPP product / industry pages -> Solutions hub.
# NOTE: enumerated explicitly with force = true. On this Netlify site the non-forced
# ("shadow") wildcard fallback was NOT applied — dead paths 404'd and some still served
# stale edge-cached old content. Forcing wins over both. Safe because these exact paths
# have no matching new page (a forced /solutions/* wildcard would instead shadow real
# sub-pages like /solutions/payments/, so we list the known legacy URLs one by one).
[[redirects]]
  from = "/solutions/tracker/"
  to = "/solutions/"
  status = 301
  force = true

[[redirects]]
  from = "/solutions/dpp/"
  to = "/solutions/"
  status = 301
  force = true

[[redirects]]
  from = "/solutions/private-blockchain-in-telecoms/"
  to = "/solutions/"
  status = 301
  force = true

[[redirects]]
  from = "/solutions/blockchain-food-supply-chain/"
  to = "/solutions/"
  status = 301
  force = true

[[redirects]]
  from = "/solutions/blockchain-in-insurance/"
  to = "/solutions/"
  status = 301
  force = true

# Old educational resources (blockchain 101 etc.) -> new Resources page. Forced, enumerated
# (a forced /resources/* wildcard would loop on the real /resources/ page).
[[redirects]]
  from = "/resources/what-is-blockchain-technology-and-how-does-it-work/"
  to = "/resources/"
  status = 301
  force = true

[[redirects]]
  from = "/resources/benefits-of-blockchain-how-it-can-transform-an-industry/"
  to = "/resources/"
  status = 301
  force = true

[[redirects]]
  from = "/resources/blockchain-for-social-good/"
  to = "/resources/"
  status = 301
  force = true

[[redirects]]
  from = "/resources/blockchain-food-supply-chain/"
  to = "/resources/"
  status = 301
  force = true
