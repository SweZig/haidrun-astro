# Netlify staging config — Haidrun (Astro)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Staging: leave PUBLIC_INDEXABLE unset/false → pages emit noindex AND /robots.txt disallows all.
  # Production launch: set PUBLIC_INDEXABLE = "true" (here or in the Netlify UI) and redeploy.
  # That single switch flips BOTH the noindex meta and /robots.txt (Allow + Sitemap). robots.txt
  # is generated by src/pages/robots.txt.ts; the /thank-you page stays noindex regardless.
