# Netlify staging config — Haidrun (Astro)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Indexing switch — PUBLIC_INDEXABLE drives BOTH the noindex meta tag and /robots.txt.
#  - Production (live haidrun.com): indexable → robots.txt Allow + Sitemap, no noindex.
#  - Deploy previews / branch deploys: variable absent here → they stay noindex + Disallow.
# robots.txt is generated by src/pages/robots.txt.ts; the /thank-you page stays noindex regardless.
[context.production.environment]
  PUBLIC_INDEXABLE = "true"
